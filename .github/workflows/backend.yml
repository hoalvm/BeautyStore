name: Backend verify

on:
  push:
    branches:
      - backend
      - frontend
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: maven

      - name: Require Docker for MySQL migration verification
        run: docker info

      - name: Verify backend
        run: |
          chmod +x mvnw
          ./mvnw -B clean verify

      - name: Require migration tests to run, not skip
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("target/surefire-reports/TEST-t4m.beauty_store.BeautyStoreMySqlMigrationTests.xml").getroot()
          assert int(suite.attrib["tests"]) >= 1
          assert all(int(suite.attrib.get(key, "0")) == 0 for key in ("skipped", "failures", "errors")), suite.attrib
          PY

      - name: Smoke test local startup without sending email
        run: |
          java -jar target/beauty-store-0.0.1-SNAPSHOT.jar > target/demo-smoke.log 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/api/products > target/demo-catalog.json; then
              ready=true
              break
            fi
            if ! kill -0 "$demo_pid" 2>/dev/null; then
              tail -80 target/demo-smoke.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" = true
          python - <<'PY'
          import json
          with open("target/demo-catalog.json") as f:
              assert json.load(f)["totalElements"] == 40
          PY
          curl --fail --silent http://localhost:8080/ > target/storefront.html
          if grep -q '/demo/inbox' target/storefront.html; then
            echo "Removed demo mailbox must not be linked"
            exit 1
          fi
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:8080/demo/api/mail)" = 302
          curl --fail --silent http://localhost:8080/vendor/bootstrap-5.3.0/bootstrap.min.css > /dev/null
