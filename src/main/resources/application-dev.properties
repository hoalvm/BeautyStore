# Local development keeps the production schema contract while enabling the
# idempotent fictional BeautyStore demo catalog through the `dev` profile.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=true

store.cookies.secure=false
security.jwt.cookie-secure=false
logging.level.t4m.beauty_store=INFO
logging.level.org.hibernate.SQL=OFF
