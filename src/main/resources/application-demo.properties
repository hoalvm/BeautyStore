# Local-only demo: no MySQL, SMTP, Cloudinary, Gemini or VNPay credentials needed.
# Data survives restart and `mvn clean`; it is never a production database.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./.beautystore/demo;MODE=MySQL;NON_KEYWORDS=USER;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Deliberately public demo key, accepted only with the isolated demo profile.
security.jwt.secret=beautystore-local-demo-only-not-for-production-2026
security.jwt.cookie-secure=false
store.cookies.secure=false
store.legal-name=BeautyStore Demo (du lieu mo phong)
store.legal-address=Moi truong demo tren may ca nhan
store.support-email=demo@example.test
spring.mail.from=demo@example.test
spring.mail.host=localhost
spring.mail.username=
spring.mail.password=
gemini.api.key=
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
vnpay.tmn-code=
vnpay.hash-secret=

logging.level.root=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
