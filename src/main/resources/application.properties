# Web App Configuration
spring.application.name=beauty-store
# Load local development secrets from an ignored .env file when present.
# Real environment variables still take precedence in CI and production.
spring.config.import=optional:file:.env[.properties]
app.base-url=${APP_BASE_URL:http://localhost:8080}

# BeautyStore identity and customer-facing policy configuration
store.name=${STORE_NAME:BeautyStore}
store.legal-name=${STORE_LEGAL_NAME:}
store.legal-address=${STORE_LEGAL_ADDRESS:}
store.support-email=${STORE_SUPPORT_EMAIL:support@beautystore.vn}
store.hotline=${STORE_HOTLINE:1800-8080}
store.base-url=${APP_BASE_URL:http://localhost:8080}
store.shipping-fee=${STORE_SHIPPING_FEE:30000}
store.free-shipping-threshold=${STORE_FREE_SHIPPING_THRESHOLD:500000}
store.cookies.secure=${STORE_COOKIE_SECURE:false}
checkout.rate-limit.max-per-ip=${CHECKOUT_RATE_LIMIT_PER_IP:10}
checkout.rate-limit.max-per-contact=${CHECKOUT_RATE_LIMIT_PER_CONTACT:5}
checkout.rate-limit.window=${CHECKOUT_RATE_LIMIT_WINDOW:PT15M}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}

# Authentication
security.jwt.secret=${JWT_SECRET:}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
security.jwt.expiration=${JWT_EXPIRATION:PT6H}

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/beauty_store}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Flyway baselines an existing legacy schema at V1, then applies BeautyStore migrations.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini AI Chatbot Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
chatbot.retry.max-attempts=3
chatbot.retry.delay-ms=2000
chatbot.rate-limit.max-requests=${CHATBOT_RATE_LIMIT_MAX_REQUESTS:20}
chatbot.rate-limit.window=${CHATBOT_RATE_LIMIT_WINDOW:PT1M}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:beautystore-products}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
uploads.evidence.pending-ttl=${EVIDENCE_UPLOAD_PENDING_TTL:PT24H}
uploads.evidence.cleanup-ms=${EVIDENCE_UPLOAD_CLEANUP_MS:3600000}

# VNPay Configuration (Sandbox)
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay/ipn}
