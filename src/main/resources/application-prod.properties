# Production must only validate a schema migrated before application startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
security.jwt.cookie-secure=true
store.cookies.secure=true

spring.main.banner-mode=off
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Required production values are supplied through environment-backed properties
# and checked by ProductionConfigurationValidator without logging their contents.
