<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='Đăng ký – BeautyStore')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-container" id="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="h2 mb-0"><i class="fas fa-user-plus me-2" aria-hidden="true"></i>Tạo tài khoản BeautyStore</h1>
                        <p class="mb-0 mt-2 opacity-75">Lưu sản phẩm yêu thích và theo dõi đơn hàng dễ dàng.</p>
                    </div>
                    <div class="auth-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg" id="registerEmail" name="email"
                                       autocomplete="username" inputmode="email" maxlength="255" required>
                            </div>
                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Mật khẩu</label>
                                <input type="password" class="form-control form-control-lg" id="registerPassword"
                                       name="password" autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="registerPasswordHelp" required>
                                <small id="registerPasswordHelp" class="text-muted">8–128 ký tự, có chữ hoa, chữ thường, số, ký tự đặc biệt và không có khoảng trắng.</small>
                            </div>
                            <div class="mb-3">
                                <label for="registerConfirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control form-control-lg" id="registerConfirmPassword"
                                       name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="128" required>
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">
                                <i class="fas fa-user-check me-2"></i>Đăng ký
                            </button>
                        </form>

                        <div id="registerMessage" class="mt-3 d-none" role="status" aria-live="polite" aria-atomic="true"></div>

                        <div class="text-center">
                            <span class="text-muted">Đã có tài khoản? </span>
                            <a th:href="@{/login}" class="text-decoration-none fw-semibold">Đăng nhập ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
