<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='Đăng ký – BeautyStore')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-container" id="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="auth-header">
                        <h2 class="mb-0"><i class="fas fa-user-plus me-2"></i>Tạo tài khoản BeautyStore</h2>
                        <p class="mb-0 mt-2 opacity-75">Lưu sản phẩm yêu thích và theo dõi đơn hàng dễ dàng.</p>
                    </div>
                    <div class="auth-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg" id="registerEmail" name="email"
                                       required>
                            </div>
                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Mật khẩu bí mật</label>
                                <input type="password" class="form-control form-control-lg" id="registerPassword"
                                       name="password" required>
                            </div>
                            <div class="mb-3">
                                <label for="registerConfirmPassword" class="form-label">Xác nhận mật khẩu</label>
                                <input type="password" class="form-control form-control-lg" id="registerConfirmPassword"
                                       name="confirmPassword" required>
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">
                                <i class="fas fa-user-check me-2"></i>Đăng ký
                            </button>
                        </form>

                        <div id="registerMessage" class="mt-3 d-none"></div>

                        <div class="text-center">
                            <span class="text-muted">Đã có tài khoản? </span>
                            <a th:href="@{/login}" class="text-decoration-none fw-semibold">Đăng nhập ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
