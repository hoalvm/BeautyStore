<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(title='Đặt lại mật khẩu – BeautyStore')}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

    <div class="auth-container" id="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="h2 mb-0"><i class="fas fa-key me-2" aria-hidden="true"></i>Tạo mật khẩu mới</h1>
                        <p class="mb-0 mt-2 opacity-75">Nếu email tồn tại, mã OTP sẽ được gửi tới hộp thư. Kiểm tra cả thư rác; mã có hiệu lực trong 5 phút.</p>
                    </div>
                    <div class="auth-body">
                        <form id="resetForm">
                            <div class="mb-3">
                                <label for="resetEmail" class="form-label">Email tài khoản</label>
                                <input type="email" class="form-control form-control-lg" id="resetEmail" name="email"
                                       required autocomplete="username" inputmode="email" maxlength="255">
                            </div>
                            <div class="mb-3">
                                <label for="resetOtp" class="form-label">Mã OTP</label>
                                <input type="text" class="form-control form-control-lg text-center" id="resetOtp"
                                       name="otp" required inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code"
                                       placeholder="Nhập 6 chữ số" maxlength="6">
                            </div>
                            <div class="mb-3">
                                <label for="resetPassword" class="form-label">Mật khẩu mới</label>
                                <input type="password" class="form-control form-control-lg" id="resetPassword"
                                       name="newPassword" required autocomplete="new-password" minlength="8" maxlength="128" aria-describedby="resetPasswordHelp">
                                <small id="resetPasswordHelp" class="text-muted">8–128 ký tự, có chữ hoa, chữ thường, số, ký tự đặc biệt và không có khoảng trắng. Không dùng lại mật khẩu hiện tại.</small>
                            </div>
                            <div class="mb-4">
                                <label for="resetConfirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                                <input type="password" class="form-control form-control-lg" id="resetConfirmPassword"
                                       name="confirmNewPassword" required autocomplete="new-password" minlength="8" maxlength="128">
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 mb-3">
                                <i class="fas fa-key me-2"></i>Cập nhật mật khẩu
                            </button>
                            <button id="resendResetOtpButton" type="button" class="btn btn-outline-secondary w-100">Gửi lại mã OTP</button>
                        </form>

                        <div id="resetMessage" class="mt-3 d-none" role="status" aria-live="polite" aria-atomic="true"></div>

                        <div class="text-center mt-4">
                            <a th:href="@{/login}" class="text-decoration-none me-3">
                                <i class="fas fa-sign-in-alt me-1"></i>Đăng nhập
                            </a>
                            <a th:href="@{/}" class="text-decoration-none">
                                <i class="fas fa-home me-1"></i>Trang chủ
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
