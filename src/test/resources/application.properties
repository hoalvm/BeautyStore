spring.application.name=beauty-store-test
spring.profiles.active=test
security.jwt.secret=beautystore-test-secret-key-that-is-never-used-in-production

spring.datasource.url=jdbc:h2:mem:beautystore_${random.uuid};MODE=MySQL;NON_KEYWORDS=USER;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=

gemini.api.key=
cloudinary.cloud-name=
cloudinary.api-key=
cloudinary.api-secret=
vnpay.tmn-code=
vnpay.hash-secret=

spring.main.banner-mode=off
